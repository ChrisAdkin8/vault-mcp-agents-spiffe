# Full stack: Vault Enterprise + Terraform bootstrap + Vault Agent + MCP Servers + Agent CLI.
#
# Prerequisites:
#   1. Copy docker/.env.example to docker/.env and fill in values.
#   2. Ensure VAULT_LICENSE is set (either in docker/.env or as an env var).
#
# Usage:
#   docker compose --env-file docker/.env up -d --build
#   docker compose --env-file docker/.env exec agent-cli vault-mcp-agents
#   docker compose --env-file docker/.env down
#
# For local dev (Vault OSS only, no containers for MCP/agents):
#   docker compose -f docker-compose.dev.yaml up -d

services:
  # ---------- 1. Vault Enterprise ----------
  vault:
    image: hashicorp/vault-enterprise:1.21-ent
    container_name: vault-server
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_LICENSE: "${VAULT_LICENSE}"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mcp-net

  # ---------- 2. Terraform (setup automation) ----------
  # Waits for Vault, applies configuration (PKI, AppRole, policies),
  # and writes AppRole credentials to a shared volume for the Agent.
  terraform-setup:
    image: hashicorp/terraform:latest
    container_name: terraform-bootstrap
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./terraform:/app
      - shared-creds:/creds
    working_dir: /app
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-root-token"
    command: >
      sh -c "terraform init && terraform apply -auto-approve"
    networks:
      - mcp-net

  # ---------- 3. Vault Agent (sidecar) ----------
  # Reads AppRole credentials from the shared volume, authenticates
  # to Vault, and renders X.509 SVIDs to the certificate volume.
  vault-agent:
    image: hashicorp/vault-enterprise:1.21-ent
    container_name: vault-agent
    restart: always
    depends_on:
      terraform-setup:
        condition: service_completed_successfully
    volumes:
      - ./config/agent.hcl:/etc/vault/agent.hcl:ro
      - shared-creds:/vault/creds:ro
      - certs-vol:/etc/mcp/certs
    environment:
      VAULT_LICENSE: "${VAULT_LICENSE}"
    command: ["vault", "agent", "-config=/etc/vault/agent.hcl"]
    networks:
      - mcp-net

  # ---------- 4. Data MCP Server (GCS + BigQuery) ----------
  data-mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server.Dockerfile
      args:
        MCP_SERVER_MODULE: vault_mcp_agents.mcp.data_server
    environment:
      MCP_TRANSPORT: "http"
      MCP_PORT: "8001"
      MCP_HOST: "0.0.0.0"
      VAULT_ADDR: "http://vault:8200"
    ports:
      - "8001:8001"
    depends_on:
      vault-agent:
        condition: service_started
    volumes:
      - certs-vol:/etc/mcp/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mcp-net

  # ---------- 5. Compute MCP Server (GCE) ----------
  compute-mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server.Dockerfile
      args:
        MCP_SERVER_MODULE: vault_mcp_agents.mcp.compute_server
    environment:
      MCP_TRANSPORT: "http"
      MCP_PORT: "8002"
      MCP_HOST: "0.0.0.0"
      VAULT_ADDR: "http://vault:8200"
    ports:
      - "8002:8002"
    depends_on:
      vault-agent:
        condition: service_started
    volumes:
      - certs-vol:/etc/mcp/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mcp-net

  # ---------- 6. Agent CLI ----------
  agent-cli:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    environment:
      VAULT_ADDR: "http://vault:8200"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      data-mcp-server:
        condition: service_healthy
      compute-mcp-server:
        condition: service_healthy
    volumes:
      - certs-vol:/etc/mcp/certs:ro
    stdin_open: true
    tty: true
    networks:
      - mcp-net

volumes:
  vault-data:
  shared-creds:
  certs-vol:

networks:
  mcp-net:
    driver: bridge
