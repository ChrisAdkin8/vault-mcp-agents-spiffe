# Full stack: Vault + vault-init bootstrap + Vault Agent + MCP Servers + Agent CLI.
#
# Prerequisites:
#   1. Copy docker/.env.example to docker/.env and fill in values.
#   2. (Optional) Set GCP_SA_KEY_FILE, DATA_AGENT_SA_EMAIL, and
#      COMPUTE_AGENT_SA_EMAIL in docker/.env to enable the GCP secrets engine.
#
# Usage:
#   docker compose --env-file docker/.env up -d --build
#   docker compose --env-file docker/.env exec agent-cli vault-mcp-agents
#   docker compose --env-file docker/.env down
#
# For local dev (Vault OSS only, no containers for MCP/agents):
#   docker compose -f docker-compose.dev.yaml up -d

services:
  # ---------- 1. Vault ----------
  vault:
    image: hashicorp/vault:1.21
    container_name: vault-server
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mcp-net

  # ---------- 2. Vault Init (setup automation) ----------
  # Waits for Vault, configures PKI, AppRole, policies, GCP secrets engine,
  # userpass auth + test users, and writes AppRole credentials to a shared volume.
  vault-init:
    image: hashicorp/vault:1.21
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./scripts/vault_init.sh:/scripts/vault_init.sh:ro
      - shared-creds:/creds
      - ${GCP_SA_KEY_FILE:-/dev/null}:/gcp/sa-key.json:ro
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-root-token"
      DATA_AGENT_SA_EMAIL: "${DATA_AGENT_SA_EMAIL:-}"
      COMPUTE_AGENT_SA_EMAIL: "${COMPUTE_AGENT_SA_EMAIL:-}"
    entrypoint: ["sh", "/scripts/vault_init.sh"]
    networks:
      - mcp-net

  # ---------- 3. Vault Agent (sidecar) ----------
  # Reads AppRole credentials from the shared volume, authenticates
  # to Vault, and renders X.509 SVIDs to the certificate volume.
  vault-agent:
    image: hashicorp/vault:1.21
    container_name: vault-agent
    restart: always
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - ./config/agent.hcl:/etc/vault/agent.hcl:ro
      - shared-creds:/vault/creds:ro
      - certs-vol:/etc/mcp/certs
    environment:
    command: ["vault", "agent", "-config=/etc/vault/agent.hcl"]
    networks:
      - mcp-net

  # ---------- 4. Data MCP Server (GCS + BigQuery) ----------
  data-mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server.Dockerfile
      args:
        MCP_SERVER_MODULE: vault_mcp_agents.mcp.data_server
    environment:
      MCP_TRANSPORT: "http"
      MCP_PORT: "8001"
      MCP_HOST: "0.0.0.0"
      VAULT_ADDR: "http://vault:8200"
    depends_on:
      vault-agent:
        condition: service_started
    volumes:
      - certs-vol:/etc/mcp/certs:ro
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/etc/mcp/certs/ca.crt", "--cert", "/etc/mcp/certs/server.crt", "--key", "/etc/mcp/certs/server.key", "-f", "https://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mcp-net

  # ---------- 5. Compute MCP Server (GCE) ----------
  compute-mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server.Dockerfile
      args:
        MCP_SERVER_MODULE: vault_mcp_agents.mcp.compute_server
    environment:
      MCP_TRANSPORT: "http"
      MCP_PORT: "8002"
      MCP_HOST: "0.0.0.0"
      VAULT_ADDR: "http://vault:8200"
    depends_on:
      vault-agent:
        condition: service_started
    volumes:
      - certs-vol:/etc/mcp/certs:ro
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/etc/mcp/certs/ca.crt", "--cert", "/etc/mcp/certs/server.crt", "--key", "/etc/mcp/certs/server.key", "-f", "https://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mcp-net

  # ---------- 6. Agent CLI ----------
  agent-cli:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    environment:
      VAULT_ADDR: "http://vault:8200"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      data-mcp-server:
        condition: service_healthy
      compute-mcp-server:
        condition: service_healthy
    volumes:
      - certs-vol:/etc/mcp/certs:ro
    stdin_open: true
    tty: true
    networks:
      - mcp-net

volumes:
  vault-data:
  shared-creds:
  certs-vol:

networks:
  mcp-net:
    driver: bridge
